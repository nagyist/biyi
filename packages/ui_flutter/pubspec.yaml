name: beyondtranslate_ui
description: "The Flutter implementation of the BeyondTranslate UI design system."
publish_to: "none"
version: 0.1.0
resolution: workspace

environment:
  sdk: ">=3.9.2 <4.0.0"

dependencies:
  collection: ^1.18.0
  flutter:
    sdk: flutter

dev_dependencies:
  # A range rather than a caret: this is a dev dependency, and in a pub
  # workspace one member's floor is every member's. The package is linted
  # against 6 here; a host on 5 is not asked to move for it.
  flutter_lints: ">=5.0.0 <7.0.0"
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: false
